name: SAST and Secret Scan

# SAST + secret scanning for the API. Free CI tooling (no GitHub Advanced
# Security license required). SAST is REPORT-ONLY during rollout so it surfaces
# findings without blocking merges on the pre-existing backlog — ratchet it to
# blocking (remove `continue-on-error`) once the initial findings are triaged.
# Secret scanning IS blocking: it is diff-aware and only fails on a NEW verified
# secret, which is always actionable.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # weekly Monday 06:23 UTC (off-minute)

permissions:
  contents: read

jobs:
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan (report-only during rollout)
        continue-on-error: true
        # `--config=auto` requires `--metrics=on` and hard-errors under
        # `--metrics=off` (exit 2), which `continue-on-error` was masking — the
        # scan never actually ran. Pin the `p/default` ruleset so it scans for
        # real without sending telemetry.
        run: semgrep scan --config=p/default --error --severity=ERROR --metrics=off

  secrets:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          # Exclude the Lob detector: it matches any `test_<word>` string (Lob test keys are
          # `test_<hex>`) and "verifies" it against Lob's permissive test API, so Python test
          # names in git history (e.g. `test_single_file_without_image_extension`) are reported as
          # verified secrets. openfilter has no Lob (mail/address API) integration, so the detector
          # is pure false-positive noise here.
          extra_args: --only-verified --exclude-detectors=lob
          version: "3.95.9"
